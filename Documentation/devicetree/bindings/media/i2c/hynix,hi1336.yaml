%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/hynix,hi1336.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SK Hynix Hi-1336 Image Sensor

description:
  The Hi-1336 is a 13MP raw image sensor controlled over I2C and
  transmitting RAW10 data over a 4-lane MIPI CSI-2 D-PHY interface.

maintainers:
  - Athbe <athbe@users.noreply.github.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: hynix,hi1336

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the sensor reset pin.
    maxItems: 1

  vdda-supply:
    description: Analogue voltage supply.

  vddd-supply:
    description: Digital core voltage supply.

  vddio-supply:
    description: Digital I/O voltage supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@20 {
              compatible = "hynix,hi1336";
              reg = <0x20>;
              clocks = <&camera_mclk>;
              reset-gpios = <&tlmm 78 GPIO_ACTIVE_LOW>;
              vdda-supply = <&vreg_2p8>;
              vddd-supply = <&vreg_1p1>;
              vddio-supply = <&vreg_1p8>;

              port {
                  endpoint {
                      data-lanes = <1 2 3 4>;
                      link-frequencies = /bits/ 64 <360000000 720000000>;
                      remote-endpoint = <&mipi_csi2_ep>;
                  };
              };
          };
      };
...
